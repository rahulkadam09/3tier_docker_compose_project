<!DOCTYPE html>
<html>
<head>
    <title>Frontend Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>User Registration</h2>

        <form action="/submit" method="POST">

            <input
                type="text"
                name="username"
                placeholder="Username"
                required
            >

            <input
                type="email"
                name="email"
                placeholder="Email"
                required
            >

            <button type="submit">Submit</button>

        </form>
    </div>

</body>
</html>
